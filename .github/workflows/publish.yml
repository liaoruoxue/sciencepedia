name: Publish site & directory search

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # 避免因我们自动提交（带 [skip ci]）造成循环
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 当前版本够用；需要历史时可改 0

      # 生成仅目录的索引（目录名检索的核心数据）
      - name: Generate docs/directory_index.txt (directories only)
        run: |
          mkdir -p docs
          find . -type d \
            -not -path './.git*' \
            -not -path './.github*' \
            -not -path './site*' \
            -not -path './docs/site*' \
          | sed 's|^\./||' \
          | sort > docs/directory_index.txt

      - name: Gzip the directory index
        run: |
          gzip -9 -c docs/directory_index.txt > docs/directory_index.txt.gz
          wc -l docs/directory_index.txt | awk '{print "{\"count\":"$1"}"}' > docs/directory_meta.json

      # 生成轻量的检索页（运行时加载 txt.gz / txt）
      - name: Generate docs/dir-search.html
        run: |
          cat > docs/dir-search.html << 'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>目录检索（仅目录名）</title>
            <style>
              body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 1rem; }
              h1 { margin: 0 0 .5rem; }
              .tip { color:#57606a; font-size:13px; margin-bottom: .75rem; }
              #search { width:100%; padding:8px; font-size:14px; box-sizing:border-box; margin-bottom:.5rem; }
              #count { color:#666; font-size:12px; margin-bottom:.5rem; }
              ul { list-style:none; padding:0; margin:0; border:1px solid #ddd; max-height:75vh; overflow:auto; }
              li { padding:2px 6px; }
              li:nth-child(odd) { background:#fafafa; }
              a { text-decoration:none; color:#0969da; font-size:13px; }
              a:hover { text-decoration:underline; }
            </style>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js" integrity="sha512-FmM9tQCyYqNdOdsWBjlx1hG3QBjX17cYy1tD9m+zVZf4PpJwE1dBvbaRfM3sCVNhl2JkdyUoNmpxN9nvv2Vqaw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
          </head>
          <body>
            <h1>目录检索（仅目录名）</h1>
            <div class="tip">输入任意关键词做“部分匹配”，点击结果跳转到 GitHub 对应目录。</div>
            <input id="search" placeholder="例如：数学@@872779 / Borsuk-Ulam / 概念 …" />
            <div id="count">正在加载目录索引…</div>
            <ul id="list"></ul>

            <script>
              const listEl = document.getElementById('list');
              const countEl = document.getElementById('count');
              const searchEl = document.getElementById('search');
              const GH_DIR = 'https://github.com/liaoruoxue/sciencepedia/tree/main/';

              let paths = [];       // 原始目录列表
              let lower = [];       // 小写用于匹配
              const PAGE_LIMIT = 800; // 每次最多渲染 800 条，避免卡顿

              async function fetchArrayBuffer(url) {
                const r = await fetch(url);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.arrayBuffer();
              }
              async function fetchText(url) {
                const r = await fetch(url);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.text();
              }

              async function loadIndex() {
                try {
                  const ab = await fetchArrayBuffer('directory_index.txt.gz');
                  const u8 = new Uint8Array(ab);
                  const txt = window.pako ? pako.inflate(u8, { to: 'string' }) : '';
                  if (txt) return txt;
                  throw new Error('pako not available');
                } catch (e) {
                  return await fetchText('directory_index.txt');
                }
              }

              function render(indexes) {
                listEl.innerHTML = '';
                const slice = indexes.slice(0, PAGE_LIMIT);
                for (const i of slice) {
                  const p = paths[i];
                  const li = document.createElement('li');
                  const a = document.createElement('a');
                  a.href = GH_DIR + encodeURI(p);
                  a.target = '_blank';
                  a.rel = 'noopener noreferrer';
                  a.textContent = p;
                  li.appendChild(a);
                  listEl.appendChild(li);
                }
                if (indexes.length === 0) {
                  countEl.textContent = '没有匹配结果';
                } else if (indexes.length > PAGE_LIMIT) {
                  countEl.textContent = `匹配 ${indexes.length} 条，已显示前 ${PAGE_LIMIT} 条`;
                } else {
                  countEl.textContent = `匹配 ${indexes.length} 条`;
                }
              }

              (async function init() {
                try {
                  const txt = await loadIndex();
                  paths = txt.split('\n').filter(Boolean);
                  lower = paths.map(s => s.toLowerCase());
                  countEl.textContent = `索引载入完成，共 ${paths.length} 个目录。请输入关键字开始过滤（默认不渲染全部）。`;
                } catch (e) {
                  console.error(e);
                  countEl.textContent = '加载索引失败';
                }

                let raf = null;
                searchEl.addEventListener('input', function() {
                  if (!paths.length) return;
                  const q = this.value.trim().toLowerCase();
                  if (raf) cancelAnimationFrame(raf);
                  raf = requestAnimationFrame(() => {
                    if (!q) {
                      listEl.innerHTML = '';
                      countEl.textContent = `共 ${paths.length} 个目录。请输入关键字开始过滤。`;
                      return;
                    }
                    const matched = [];
                    for (let i = 0; i < lower.length; i++) {
                      if (lower[i].includes(q)) matched.push(i);
                    }
                    render(matched);
                  });
                });
              })();
            </script>
          </body>
          </html>
          EOF

      # 确保有首页（便于 mkdocs 正常发布）
      - name: Ensure docs/index.md exists
        run: |
          if [ ! -f docs/index.md ]; then
            printf '# SciencePedia\n\n - [目录检索（仅目录名）](dir-search.html)' > docs/index.md
          fi

      # 只在索引或检索页有变化时提交一次（避免循环）
      - name: Commit and push index/search if changed
        run: |
          if git status --porcelain docs/directory_index.txt docs/directory_index.txt.gz docs/directory_meta.json docs/dir-search.html docs/index.md | grep .; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/directory_index.txt docs/directory_index.txt.gz docs/directory_meta.json docs/dir-search.html docs/index.md
            git commit -m "chore: update dir index & search page [skip ci]"
            git push
          else
            echo "No changes"
          fi

      # 构建并发布 MkDocs 站点（包含检索页）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install mkdocs-material
        run: |
          pip install mkdocs-material

      - name: Deploy mkdocs to GitHub Pages
        run: |
          mkdocs gh-deploy --force

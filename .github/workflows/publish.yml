name: Generate directory index

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate directory index
        run: |
          find . -type d \
            -not -path './.git*' \
            -not -path './.github*' \
            -not -path './site*' \
            -not -path './docs/site*' \
          | sed 's|^\./||' \
          | sort > directory_index.txt

      - name: Commit and push if changed
        run: |
          if git status --porcelain directory_index.txt | grep .; then
            echo "directory_index.txt changed, committing..."

            git config user.name  "riso"
            git config user.email "ruoxue@gmail.com"

            git add directory_index.txt
            git commit -m "chore: update directory index [skip ci]"
            git push
          else
            echo "No changes in directory_index.txt"
          fi

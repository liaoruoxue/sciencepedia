site_name: SciencePedia
site_url: https://liaoruoxue.github.io/sciencepedia/
repo_url: https://github.com/liaoruoxue/sciencepedia
repo_name: SciencePedia

# 不设置 docs_dir，保持默认 docs/，避免循环构建问题
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.top
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

plugins:
  - search

# 关闭自定义占位符被当作坏链接的噪音
validation:
  links:
    unrecognized_links: ignore
